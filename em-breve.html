<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Site em construção · Noémia</title>
<meta name="description" content="O Noémia já está aberto. O novo site está em construção — venha à nossa mesa entretanto.">
<meta name="robots" content="noindex">

<link rel="icon" type="image/png" sizes="32x32" href="assets/logo/favicon-32.png">
<link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="embreve-page">

<!--
  NOTA PARA O CLIENTE:
  Esta é uma página autónoma de "Site em construção", separada do site
  principal (index.html). O restaurante já está aberto — esta tela deixa
  isso claro e convida o visitante a contactar/visitar entretanto.
  Para colocar esta página online primeiro, basta apontar o domínio para
  este ficheiro (em-breve.html) em vez do index.html.
-->

<div class="grain"></div>

<div class="embreve">
  <div class="embreve-media">
    <img src="assets/img/parede-vinhos.jpg" alt="Parede de garrafas de vinho expostas no Noémia" loading="eager">
    <div class="embreve-overlay"></div>
  </div>

  <div class="embreve-content container">
    <img src="assets/logo/noemia-white.png" alt="Noémia" class="embreve-logo">

    <svg class="embreve-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l-1 6a3 3 0 0 1-3 3 3 3 0 0 1-3-3L8 3z"/><path d="M12 12v6"/><path d="M9 21h6"/></svg>

    <p class="embreve-eyebrow">Já estamos abertos</p>
    <h1 class="embreve-heading">O site ainda está a decantar!</h1>

    <!-- NOTA PARA O CLIENTE: substituir o href abaixo pelo link real de reservas quando for enviado. -->
    <a href="RESERVAS_URL_AQUI" target="_blank" rel="noopener" class="btn btn-outline-light embreve-cta">Fazer Reserva</a>

    <div class="embreve-info">
      <div class="info-block">
        <span class="info-label">Morada</span>
        <span class="info-value">R. do Duque, 21, 1200-158 Lisboa</span>
      </div>
      <div class="info-block">
        <span class="info-label">Telefone</span>
        <span class="info-value"><a href="tel:+351210509605">(+351) 210 509 605</a></span>
      </div>
      <div class="info-block">
        <span class="info-label">Email</span>
        <span class="info-value"><a href="mailto:noemia.contacto@gmail.com">noemia.contacto@gmail.com</a></span>
      </div>
      <div class="info-block">
        <span class="info-label">Instagram</span>
        <span class="info-value"><a href="https://instagram.com/noemia_restaurante" target="_blank" rel="noopener">@noemia_restaurante</a></span>
      </div>
    </div>
  </div>

  <p class="embreve-credit">&copy; <span id="year"></span> Noémia · Vinhos, Tapas e Fados</p>
</div>

<script>document.getElementById("year").textContent = new Date().getFullYear();</script>
</body>
</html>
